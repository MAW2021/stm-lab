<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STM-Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* STM-Lab: drafting-table workspace. Step rail on the left, model canvas in the middle, inspector on the right. */
:root{
  --bg:#eef0f2; --sheet:#ffffff; --ink:#1b2129; --mut:#5d6773; --line:#d3d8de; --rail:#f7f8f9;
  --accent:#2a5b84; --strut:#1f63b6; --tie:#c23a2b; --ok:#1d7a43; --ng:#b3261e; --info:#8a6500;
  --grid:#e9ecef; --grid2:#d7dce1; --concrete:#e4e8ec; --concrete-edge:#8f99a4; --sel:#e08a00; --zone:#6b4fa3;
  --u0:#2f8f5b; --u1:#7aa83a; --u2:#d39b12; --u3:#e0661b; --u4:#c4271e;
  --f-ui:"IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b; --sheet:#1a2027; --ink:#e3e8ee; --mut:#9aa5b1; --line:#2e3742; --rail:#161b21;
  --accent:#7fb0dc; --strut:#6fa8f0; --tie:#f07a6a; --ok:#5cc489; --ng:#ff7b72; --info:#e0b44c;
  --grid:#1f262e; --grid2:#2a333d; --concrete:#252d36; --concrete-edge:#5d6976; --sel:#ffb340; --zone:#b39ce8;
  --u0:#4cc283; --u1:#a3cf55; --u2:#f0c040; --u3:#ff8c45; --u4:#ff6b61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --sheet:#1a2027; --ink:#e3e8ee; --mut:#9aa5b1; --line:#2e3742; --rail:#161b21;
  --accent:#7fb0dc; --strut:#6fa8f0; --tie:#f07a6a; --ok:#5cc489; --ng:#ff7b72; --info:#e0b44c;
  --grid:#1f262e; --grid2:#2a333d; --concrete:#252d36; --concrete-edge:#5d6976; --sel:#ffb340; --zone:#b39ce8;
  --u0:#4cc283; --u1:#a3cf55; --u2:#f0c040; --u3:#ff8c45; --u4:#ff6b61; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.45 var(--f-ui);margin:0}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--sheet)}
.brand{font-weight:600;letter-spacing:.02em;font-size:16px;margin-right:6px}
.brand small{font:12px var(--f-num);color:var(--mut);margin-left:6px}
.top .sp{flex:1}
.btn{font:500 13px var(--f-ui);padding:6px 11px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.btn.warn{border-color:var(--ng);color:var(--ng)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.step:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.steps{display:flex;gap:0;overflow-x:auto;background:var(--sheet);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.step{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 14px 8px;font:500 13px var(--f-ui);color:var(--mut);cursor:pointer;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:600 11px var(--f-num)}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.step[aria-current="step"] b{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.step .dot{width:7px;height:7px;border-radius:50%;background:var(--line)} .step .dot.ok{background:var(--ok)} .step .dot.ng{background:var(--ng)}
main{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;min-height:calc(100vh - 96px)}
aside{background:var(--rail);padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
aside.rail{border-right:1px solid var(--line)} aside.insp{border-left:1px solid var(--line)}
.grp{display:flex;flex-direction:column;gap:7px}
.grp h3,aside h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
label.f{display:grid;grid-template-columns:1fr 104px;align-items:center;gap:8px;font-size:12.5px}
label.f span.u{font:11px var(--f-num);color:var(--mut)}
label.full{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
label.ck{display:flex;align-items:center;gap:6px;font-size:12.5px}
label.ck input{width:auto}
input:disabled,select:disabled{opacity:.6;background:var(--rail)}
input,select,textarea{font:13px var(--f-num);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:4px 6px;width:100%;min-width:0}
textarea{min-height:240px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px} .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row2 label,.row3 label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mut)}
section.work{padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.verdict{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:30px}
.pill{font:600 13px var(--f-ui);padding:4px 10px;border-radius:999px;border:1.5px solid}
.pill.OK{color:var(--ok);border-color:var(--ok)} .pill.NG{color:var(--ng);border-color:var(--ng)} .pill.INFO{color:var(--info);border-color:var(--info)}
.kv{font:12px var(--f-num);color:var(--mut)}
.banner{border:1.5px solid var(--ng);color:var(--ng);padding:7px 10px;border-radius:4px;font-weight:500}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tool{font:500 12.5px var(--f-ui);padding:5px 9px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:4px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tool kbd{font:10.5px var(--f-num);color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)} .tool[aria-pressed="true"] kbd{color:var(--sheet);border-color:var(--sheet)}
.toolbar select{width:auto;font:12px var(--f-ui)}
.canvas{position:relative;height:min(64vh,620px);min-height:340px}
svg#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
svg#cv.pan{cursor:grab} svg#cv.add{cursor:crosshair}
svg text{font-family:var(--f-num);font-size:11px;fill:var(--ink)} svg .nd{font:600 12px var(--f-ui)}
svg .halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.status{display:flex;flex-wrap:wrap;gap:14px;padding:5px 10px;border-top:1px solid var(--line);font:11.5px var(--f-num);color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.chip{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:3px}
.hint{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{font:500 13px var(--f-ui);padding:8px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--rail)}
td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.s{font-weight:600} td.s.OK{color:var(--ok)} td.s.NG{color:var(--ng)} td.s.INFO{color:var(--info)}
tr.ng td{background:color-mix(in srgb,var(--ng) 7%,transparent)}
tr[data-pick]{cursor:pointer} tr[data-pick]:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
tr.on td{background:color-mix(in srgb,var(--sel) 16%,transparent)}
.bar{height:6px;background:var(--grid2);border-radius:3px;min-width:56px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
h2.sec{font-size:14px;margin:14px 0 6px;padding-bottom:3px;border-bottom:1.5px solid var(--ink)}
.report{padding:16px}
.report .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.report h1{font-size:18px;margin:0}
.report svg{width:100%;height:auto;max-width:900px}
.note{font-size:12px;color:var(--mut)}
.err{color:var(--ng);font:12px var(--f-num);white-space:pre-wrap}
.insp .empty{font-size:12.5px;color:var(--mut)}
.kvt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kvt dt{color:var(--mut)} .kvt dd{margin:0;font-family:var(--f-num);text-align:right}
.ck-list{display:flex;flex-direction:column;gap:6px}
.ck-item{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:12px;background:var(--sheet)}
.ck-item .h{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.ck-item .d{color:var(--mut);margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:7px 14px;border-radius:4px;font-size:13px;z-index:20}
@media (max-width:1180px){main{grid-template-columns:290px minmax(0,1fr)} aside.insp{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-items:start}}
@media (max-width:820px){main{grid-template-columns:1fr} aside.rail{border-right:0;border-bottom:1px solid var(--line)} aside{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))} section.work{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))} .canvas{height:58vh}}
@media print{header.top,nav.steps,aside,.toolbar,.status,.tabs,.noprint,.verdict,#banners{display:none!important} main{display:block} .sheet{border:0} section.work{padding:0} body{font-size:11px} .canvas{display:none} [data-panel]{display:none!important} [data-panel="report"]{display:block!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<header class="top">
  <div class="brand">STM-Lab <small id="ver"></small></div>
  <button class="btn" id="btnUndo" type="button" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn" id="btnRedo" type="button" title="Redo (Ctrl+Y)">Redo</button>
  <div class="sp"></div>
  <button class="btn" id="btnLoad" type="button">Open case…</button>
  <button class="btn" id="btnSave" type="button">Save case</button>
  <button class="btn" id="btnCopy" type="button">Copy case JSON</button>
  <button class="btn primary" id="btnPrint" type="button">Print / PDF report</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<nav class="steps" aria-label="Workflow">
  <button class="step" data-step="1" type="button"><b>1</b>Element</button>
  <button class="step" data-step="2" type="button"><b>2</b>Geometry</button>
  <button class="step" data-step="3" type="button"><b>3</b>STM model</button>
  <button class="step" data-step="4" type="button"><b>4</b>Analysis<span class="dot" id="dotA"></span></button>
  <button class="step" data-step="5" type="button"><b>5</b>Checks<span class="dot" id="dotC"></span></button>
  <button class="step" data-step="6" type="button"><b>6</b>Report</button>
</nav>

<main>
  <aside class="rail" id="rail"></aside>

  <section class="work">
    <div class="verdict" id="verdict"></div>
    <div id="banners"></div>
    <div class="sheet" id="cvSheet">
      <div class="toolbar" id="toolbar">
        <span id="tools"></span>
        <span class="sep"></span>
        <button class="tool" id="zIn" type="button" title="Zoom in">+</button>
        <button class="tool" id="zOut" type="button" title="Zoom out">−</button>
        <button class="tool" id="zFit" type="button" title="Fit to window (F)">Fit <kbd>F</kbd></button>
        <span class="sep"></span>
        <label class="hint">Colour <select id="optColor"><option value="type">Strut / tie</option><option value="force">Force</option><option value="util">Utilisation</option></select></label>
        <label class="hint">Labels <select id="optLabel"><option value="name">Names</option><option value="force">Forces</option><option value="ratio">Ratios</option><option value="none">None</option></select></label>
        <label class="ck"><input type="checkbox" id="optField">Stress field</label>
        <label class="ck"><input type="checkbox" id="optZones">Nodal zones</label>
        <label class="ck"><input type="checkbox" id="optGrid" checked>Grid</label>
        <label class="hint">Snap <select id="optSnap"><option value="0">Off</option><option value="10">10</option><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select></label>
      </div>
      <div class="canvas"><svg id="cv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strut-and-tie model canvas"></svg></div>
      <div class="status"><span id="stCoord">x –, y –</span><span id="stHint"></span><span class="legend" id="legend"></span></div>
    </div>
    <div class="sheet" id="resSheet">
      <div class="tabs noprint" role="tablist">
        <button class="tab" role="tab" data-tab="checks" aria-selected="true" type="button">Checks</button>
        <button class="tab" role="tab" data-tab="forces" aria-selected="false" type="button">Forces &amp; reactions</button>
        <button class="tab" role="tab" data-tab="report" aria-selected="false" type="button">Calculation report</button>
      </div>
      <div data-panel="checks" class="tw"></div>
      <div data-panel="forces" class="tw" hidden></div>
      <div data-panel="report" class="report" hidden></div>
    </div>
  </section>

  <aside class="insp" id="insp"></aside>
</main>

<script>
/* STM-Lab engine (JavaScript port of the Python package `stm`).
   Units: mm, kN, MPa. Member force + = tension (tie), − = compression (strut).
   Works in the browser (global STM) and in Node (module.exports). */
(function (root) {
  "use strict";

  // ------------------------------------------------------------------ codes
  const STRUT_CLASSES = {
    boundary: "Boundary strut (prismatic, e.g. compression chord)",
    interior_reinf: "Interior strut, distributed reinforcement per 23.5",
    interior_joint: "Interior strut in beam-column joint",
    interior_sizeeffect: "Interior strut in region satisfying 23.4.4",
    interior_no_reinf: "Interior strut, all other cases",
    tension_zone: "Strut in tension member / tension zone",
  };
  const CODES = {
    "ACI318-19": {
      key: "ACI318-19", name: "ACI 318-19 Chapter 23",
      beta_s: { boundary: 1.0, interior_reinf: 0.75, interior_joint: 0.75, interior_sizeeffect: 0.75, interior_no_reinf: 0.4, tension_zone: 0.4 },
      beta_n: { CCC: 1.0, CCT: 0.8, CTT: 0.6 },
      k_c: 0.85, phi_strut: 0.75, phi_node: 0.75, phi_tie: 0.75, steel_factor: 1.0,
      min_angle_deg: 25, fc_symbol: "f'c", provisional: false,
      family: "ACI",
      refs: {
        strut: "ACI 318-19 23.4.1, 23.4.3, 21.2.1", node: "ACI 318-19 23.9.1, 23.9.2",
        tie: "ACI 318-19 23.7.2", angle: "ACI 318-19 23.2.7", distributed: "ACI 318-19 23.5.1",
        sizeeffect: "ACI 318-19 23.4.4", corbel: "ACI 318-19 16.5", anchorage: "ACI 318-19 23.8.2, 25.4.2.4",
        fce: "f_ce = 0.85·β_c·β_s·f'c (23.4.3) ; 0.85·β_c·β_n·f'c (23.9.2)",
      },
    },
    "AASHTO-LRFD": {
      key: "AASHTO-LRFD", name: "AASHTO LRFD Bridge Design Specifications, Article 5.8.2",
      beta_s: { boundary: 1, interior_reinf: 1, interior_joint: 1, interior_sizeeffect: 1, interior_no_reinf: 1, tension_zone: 1 },
      beta_n: { CCC: 1, CCT: 1, CTT: 1 },
      k_c: 1.0, phi_strut: 0.70, phi_node: 0.70, phi_tie: 0.90, steel_factor: 1.0,
      min_angle_deg: 25, fc_symbol: "f'c", provisional: false, family: "AASHTO",
      refs: {
        strut: "AASHTO LRFD 5.8.2.5.1, 5.8.2.5.3a; φ = 0.70 (5.5.4.2)", node: "AASHTO LRFD 5.8.2.5.3a, Table 5.8.2.5.3a-1",
        tie: "AASHTO LRFD 5.8.2.4.1; φ = 0.90 (5.5.4.2)", angle: "STM-Lab practice limit (25°)",
        distributed: "AASHTO LRFD 5.8.2.6 (crack-control reinforcement, 0.003 each way)", sizeeffect: "-",
        corbel: "AASHTO LRFD 5.8.4.2", anchorage: "ACI 318-19 25.4.2.4 (straight bar, used as an estimate)",
        fce: "f_cu = m·ν·f'c; ν = 0.85 (CCC), 0.70 (CCT) at bearing/back faces, 0.85 − f'c/20 ksi (0.45…0.65) at strut faces and CTT nodes; 0.45 without crack control",
      },
    },
  };
  const NO_CRACK = ["interior_no_reinf", "tension_zone"];
  const aashtoNu = fc => Math.min(0.65, Math.max(0.45, 0.85 - fc / 137.9));
  function nuStrut(c, fc, cls, bs = 0) {
    if (c.family === "AASHTO") return bs > 0 ? bs : NO_CRACK.includes(cls) ? 0.45 : aashtoNu(fc);
    return c.k_c * (bs > 0 ? bs : c.beta_s[cls]);
  }
  function nuNode(c, fc, kind, face = "strut", cls = null) {
    if (c.family === "AASHTO") {
      if (face === "strut") return NO_CRACK.includes(cls) ? 0.45 : aashtoNu(fc);
      if (kind === "CTT") return aashtoNu(fc);
      return kind === "CCC" ? 0.85 : 0.70;
    }
    return c.k_c * c.beta_n[kind];
  }
  const fceStrut = (c, fc, cls, bc = 1, bs = 0) => bc * nuStrut(c, fc, cls, bs) * fc;
  const fceNode = (c, fc, kind, bc = 1, face = "strut", cls = null) => bc * nuNode(c, fc, kind, face, cls) * fc;

  // ------------------------------------------------------------------ model
  function Model(title, dim = 2, b = 300, fc = 30, fy = 420) {
    return { title, dim, b, fc, fy, nodes: {}, order: [], members: [], meta: {}, interior_width_rule: "projection", stiffness: "uniform", Es: 200000 };
  }
  function addNode(m, name, xyz, o = {}) {
    const d = m.dim;
    m.nodes[name] = Object.assign({ name, xyz: xyz.map(Number), fix: Array(d).fill(false), load: Array(d).fill(0),
      spring: null, lb: 0, wt: 0, wt_v: 0, band_dir: 0, bearing_area: 0, bearing_axis: -1, confine: 1, kind_override: "", anchor_ext: -1, smeared: false, curved: false, cut: false }, o);
    if (!m.order.includes(name)) m.order.push(name);
    return m.nodes[name];
  }
  function addMember(m, name, i, j, o = {}) {
    const e = Object.assign({ name, i, j, role: "auto", strut_class: "interior_no_reinf", beta_s: 0, width: 0, width_max: 0, area: 0, As: 0, fy: 0, db: 0, EA: 0 }, o);
    m.members.push(e);
    return e;
  }
  function geometry(m, e) {
    const a = m.nodes[e.i].xyz, b = m.nodes[e.j].xyz;
    const d = b.map((v, k) => v - a[k]);
    const L = Math.hypot(...d);
    if (!(L > 0)) throw new Error(`member ${e.name} has zero length`);
    return { L, u: d.map(v => v / L) };
  }

  function gaussSolve(A, bvec) {
    const n = bvec.length, M = A.map((r, i) => r.concat([bvec[i]]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-300) throw new Error("singular stiffness matrix");
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    const x = Array(n).fill(0);
    for (let r = n - 1; r >= 0; r--) {
      let s = M[r][n];
      for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k];
      x[r] = s / M[r][r];
    }
    return x;

  // axial stiffness for the "section" option: Es·As where steel is given, else Ec·w·b (2D) / Ec·A (3D)

    const m = () => st.spec.members.find(x => x.name === s.id);
    on("i_mname", () => { const v = $("i_mname").value.trim(); if (!v || v === s.id) return; if (st.spec.members.some(e => e.name === v)) { toast(`Member ${v} already exists`); renderInspector(); return; } mutate(() => { m().name = v; st.sel = {t: "m", id: v}; }); });
    q("[data-msel]").forEach(i => i.addEventListener("change", () => { const k = i.dataset.msel; if ((k === "i" || k === "j") && i.value === (k === "i" ? m().j : m().i)) { toast("A member needs two different nodes"); renderInspector(); return; } mutate(() => m()[k] = i.value); }));
    q("[data-mnum]").forEach(i => i.addEventListener("change", () => mutate(() => m()[i.dataset.mnum] = num(i.value))));
  } else if (s.t === "v") {
    q("[data-vx]").forEach(i => i.addEventListener("change", () => mutate(() => st.spec.outline[s.p][s.v][+i.dataset.vx] = num(i.value))));
  }
  const d = $("i_del"); if (d) d.addEventListener("click", () => deleteSel());
}

// ===================================================================== verdict, tables, report
function renderVerdict(){
  const o = st.out, v = $("verdict");
  if (!o) { v.innerHTML = `<span class="pill NG">Model problem</span><span class="err">${E(st.err)}</span>`; $("dotA").className = "dot ng"; $("dotC").className = "dot"; return; }
  const sm = o.summary, w = sm.worst;
  v.innerHTML = `<span class="pill ${sm.ok ? "OK" : "NG"}">${sm.ok ? "All checks pass" : sm.n_ng + " check(s) fail"}</span>` +
    (w ? `<span class="kv">Governing: ${E(w.kind)} ${E(w.item)} at ${w.ratio.toFixed(2)}</span>` : "") +
    `<span class="kv">${o.model.order.length} nodes · ${o.model.members.length} members · ${E(o.code.name)}${st.edited ? " · edited model" : ""}</span>`;
  $("dotA").className = "dot " + (o.res.stable ? "ok" : "ng"); $("dotC").className = "dot " + (sm.ok ? "ok" : "ng");
}
function renderBanners(){
  const o = st.out; $("banners").innerHTML = o && !o.res.stable ? `<div class="banner">The truss is unstable or out of equilibrium under these loads (residual ${o.res.residual.toExponential(1)} kN). Add members or supports. Results are not valid.</div>` : "";
}
function renderLegend(){
  const c = st.opt.color;
  $("legend").innerHTML = c === "util" ? UBINS.map((b, k) => `<span><span class="chip" style="background:var(${b[1]})"></span>${k === 4 ? ">1" : "≤" + b[0]}</span>`).join("")
    : `<span><i class="sw" style="border-color:var(--strut);border-top-style:dashed"></i>Strut</span><span><i class="sw" style="border-color:var(--tie)"></i>Tie</span>${c === "force" ? "<span>Weight ∝ force</span>" : ""}`;
}
const HEAD = `<tr><th>Item</th><th>Check</th><th>Demand</th><th>Capacity</th><th>Ratio</th><th></th><th>Status</th><th>Details</th><th>Clause</th></tr>`;
const GROUPS = [["Struts",["strut"]],["Ties",["tie"]],["Nodal zones",["node","bearing"]],["Geometry, anchorage and detailing",["angle","anchorage","detail"]]];
function checkRows(list, pick = true){
  return list.map(c => {
    const nd = c.kind === "detail" && c.capacity != null && c.capacity < 1 ? 4 : 1;
    const bar = c.ratio != null && c.kind !== "detail" ? `<div class="bar"><i style="width:${Math.min(100, c.ratio*100).toFixed(0)}%;background:${ucol(c.ratio)}"></i></div>` : "";
    const pk = pick ? pickOf(c) : "";
    return `<tr class="${c.status === "NG" ? "ng" : ""}" ${pk ? `data-pick="${E(pk)}"` : ""}><td>${E(c.item)}</td><td>${E(c.kind)}</td><td class="n">${fmt(c.demand, nd)}</td><td class="n">${fmt(c.capacity, nd)}</td><td class="n">${c.ratio == null ? "" : c.ratio.toFixed(2)}</td><td>${bar}</td><td class="s ${c.status}">${c.status}</td><td>${E(c.detail)}</td><td class="note">${E(c.clause)}</td></tr>`;
  }).join("");
}
function checksHTML(checks, pick = true){
  return GROUPS.map(([t, ks]) => { const rows = checks.filter(c => ks.includes(c.kind)); return rows.length ? `<h2 class="sec" style="margin-inline:12px">${t}</h2><div class="tw"><table>${HEAD}${checkRows(rows, pick)}</table></div>` : ""; }).join("");
}
function forcesHTML(o, pick = true){
  const m = o.model, r = o.res;
  const mem = m.members.map(e => { const g = S.geometry(m, e), f = r.forces[e.name], ang = Math.asin(Math.min(1, Math.abs(g.u[g.u.length - 1])))*180/Math.PI;
    return `<tr ${pick ? `data-pick="m:${E(e.name)}"` : ""}><td>${E(e.name)}</td><td>${E(e.i)}–${E(e.j)}</td><td class="n">${fmt(g.L, 0)}</td><td class="n">${ang.toFixed(1)}°</td><td class="n">${f >= 0 ? "+" : ""}${fmt(f)}</td><td>${Math.abs(f) < 1e-6 ? "zero" : f > 0 ? "tie" : "strut"}</td></tr>`; }).join("");
  const nod = m.order.map(n => { const N = m.nodes[n], R = r.reactions[n];
    return `<tr ${pick ? `data-pick="n:${E(n)}"` : ""}><td>${E(n)}</td><td class="n">${N.xyz.map(v => fmt(v, 0)).join(", ")}</td><td class="n">${N.load.some(v => +v) ? N.load.map(v => fmt(+v)).join(", ") : ""}</td><td>${N.fix.map((f, a) => f ? "XYZ"[a] : "").join("")}${N.spring ? " spring" : ""}</td><td class="n">${R ? R.map(v => fmt(v)).join(", ") : ""}</td></tr>`; }).join("");
  return `<h2 class="sec" style="margin-inline:12px">Member forces</h2><div class="tw"><table><tr><th>Member</th><th>Nodes</th><th>Length mm</th><th>Angle</th><th>Force kN</th><th>Type</th></tr>${mem}</table></div>
  <h2 class="sec" style="margin-inline:12px">Nodes and reactions</h2><div class="tw"><table><tr><th>Node</th><th>Coordinates mm</th><th>Load kN</th><th>Support</th><th>Reaction kN</th></tr>${nod}</table></div>`;
}
function reportHTML(){
  const o = st.out; if (!o) return `<p class="err">${E(st.err)}</p>`;
  const cs = currentCase(), m = o.model, c = o.code, sm = o.summary, today = new Date().toISOString().slice(0, 10);
  const src = cs.source, T = src && S.TEMPLATES[src.template];
  const inputs = T ? `<div class="tw"><table><tr><th>Template input (${E(T.name)})</th><th>Value</th></tr>${T.params.map(([k, lab, , u]) => `<tr><td>${E(lab)}</td><td class="n">${E(src.params[k] === "" || src.params[k] == null ? "auto" : src.params[k])} ${u !== "class" ? E(u) : ""}</td></tr>`).join("")}</table></div>${src.edited ? `<p class="note"><b>The model was edited by hand after it was generated.</b> The nodes, members and properties below govern.</p>` : ""}`
    : `<p class="note">Custom model drawn by the user: ${m.order.length} nodes, ${m.members.length} members.</p>`;
  const memProps = `<div class="tw"><table><tr><th>Member</th><th>Strut class</th><th>Width / area</th><th>As mm²</th><th>db</th></tr>${m.members.map(e => `<tr><td>${E(e.name)}</td><td>${E(e.strut_class)}</td><td class="n">${m.dim === 2 ? (e.width || "nodes") : (e.area || "nodes")}</td><td class="n">${e.As || "design"}</td><td class="n">${e.db || ""}</td></tr>`).join("")}</table></div>`;
  return `<div class="hd"><div><h1>Strut-and-tie calculation: ${E(cs.element || m.title)}</h1>
    <div class="note">Project: ${E(cs.project || "—")} · Engineer: ${E(cs.engineer || "—")} · Date: ${today} · Code: ${E(c.name)} · STM-Lab v${S.version}</div></div>
    <div><span class="pill ${sm.ok ? "OK" : "NG"}">${sm.ok ? "ALL CHECKS PASS" : sm.n_ng + " CHECK(S) FAIL"}</span></div></div>
    <h2 class="sec">1. Input data</h2>${inputs}<p class="note">b = ${m.b} mm, f'c = ${m.fc} MPa, fy = ${m.fy} MPa. Units: mm, kN, MPa. Loads are factored. Strut width at nodes without a plate: ${E(m.interior_width_rule)}. Member stiffness: ${m.stiffness === "section" ? "from the section (Es·As, Ec·w·b)" : "uniform"}.</p>
    <h2 class="sec">2. Code parameters</h2><div class="tw"><table>
      <tr><td>Effective strength</td><td>${E(c.refs.fce)}</td></tr>
      ${c.family === "AASHTO" ? "" : `<tr><td>β_s</td><td>${Object.entries(c.beta_s).map(([k, v]) => `${E(k)} ${v}`).join(", ")}</td></tr>
      <tr><td>β_n</td><td>${Object.entries(c.beta_n).map(([k, v]) => `${k} ${v}`).join(", ")}</td></tr>`}
      <tr><td>φ strut / node / tie</td><td>${c.phi_strut} / ${c.phi_node} / ${c.phi_tie}</td></tr></table></div>
    <h2 class="sec">3. Strut-and-tie model and forces</h2>${staticSVG(900, 460, {label: "force"})}
    <h2 class="sec">4. Stress field and utilisation</h2>${(() => { const k = Object.assign({}, st.opt); Object.assign(st.opt, {color: "util", field: true, zones: true}); const sv = staticSVG(900, 460, {label: "ratio"}); Object.assign(st.opt, k); return sv; })()}
    <p class="note">Colour = demand / capacity: ${UBINS.map((b, k) => `<span class="chip" style="background:var(${b[1]})"></span>${k === 4 ? "> 1.00" : "≤ " + b[0].toFixed(2)}`).join(" ")}</p>
    <h2 class="sec">5. Member properties</h2>${memProps}
    ${forcesHTML(o, false).replace(/class="sec" style="margin-inline:12px">/g, 'class="sec">')}
    ${checksHTML(o.checks, false).replace(/style="margin-inline:12px"/g, "")}
    <h2 class="sec">Assumptions and notes</h2><ul>${(m.meta.notes || []).map(n => `<li>${E(n)}</li>`).join("")}
      <li>Pin-jointed truss solved by direct stiffness; equilibrium error ${o.res.equilibrium_error.toExponential(2)} kN.</li>
      <li>Strut capacity taken at the weaker end; node faces checked for every strut, tie and bearing.</li>
      <li>Not checked: hooked/headed anchorage, crack-control detailing, serviceability.</li></ul>`;
}
function renderReport(){ document.querySelector('[data-panel="report"]').innerHTML = st.spec ? reportHTML() : ""; }
function renderTables(){
  const o = st.out;
  document.querySelector('[data-panel="checks"]').innerHTML = o ? checksHTML(o.checks) : `<p class="err" style="padding:12px">${E(st.err)}</p>`;
  document.querySelector('[data-panel="forces"]').innerHTML = o ? forcesHTML(o) : "";
  renderReport(); bindPicks($("resSheet")); highlightRows();
}
function renderAll({keepRail = false} = {}){
  document.querySelectorAll(".step").forEach(b => b.setAttribute("aria-current", +b.dataset.step === st.step ? "step" : "false"));
  $("btnUndo").disabled = !st.undo.length; $("btnRedo").disabled = !st.redo.length;
  if (!keepRail) renderRail();
  renderTools(); renderVerdict(); renderBanners(); renderLegend(); renderInspector(); renderTables(); drawCanvas();
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
}));

// ===================================================================== header actions, keys
$("zIn").addEventListener("click", () => zoomAt(1.25)); $("zOut").addEventListener("click", () => zoomAt(0.8)); $("zFit").addEventListener("click", fit);
$("btnUndo").addEventListener("click", undo); $("btnRedo").addEventListener("click", redo);
$("btnPrint").addEventListener("click", () => { goStep(6); setTimeout(() => window.print(), 80); });
$("btnCopy").addEventListener("click", () => { const txt = JSON.stringify(currentCase(), null, 1);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Case JSON copied")).catch(() => toast("Copy was blocked by the browser")); });
$("btnSave").addEventListener("click", () => { const blob = new Blob([JSON.stringify(currentCase(), null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = ((st.element || "stm-case").replace(/[^\w-]+/g, "_")) + ".json"; a.click(); });
$("btnLoad").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { loadCase(JSON.parse(rd.result)); } catch (e) { toast("Could not read that file: " + e.message); } ev.target.value = ""; }; rd.readAsText(f); });
function loadCase(c){
  pushUndo();
  st.code = S.CODES[c.code] ? c.code : "ACI318-19"; st.rule = c.interior_width_rule || (c.custom && c.custom.interior_width_rule) || "projection";
  st.project = c.project || ""; st.element = c.element || ""; st.engineer = c.engineer || "";
  if (c.custom) {
    const sp = clone(c.custom); sp.dim = sp.dim || 2; sp.outline = sp.outline || []; sp.notes = sp.notes || [];
    const tmp = S.toSpec(S.buildCustom(Object.assign({}, sp))); tmp.outline = sp.outline; tmp.notes = sp.notes; tmp.meta = Object.assign({}, sp.meta || {});
    st.spec = tmp;
    if (c.source && S.TEMPLATES[c.source.template]) { st.tpl = c.source.template; st.params[st.tpl] = Object.assign({}, c.source.params); st.edited = !!c.source.edited; }
    else { st.tpl = "custom"; st.edited = true; }
  } else if (c.template && S.TEMPLATES[c.template]) { st.tpl = c.template; st.params[st.tpl] = Object.assign({}, c.params); generate(); }
  else throw new Error("not an STM-Lab case");
  st.sel = null; analyze(); renderAll(); fit(); toast("Case loaded");
}
document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "select" || tag === "textarea") return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === "y") { ev.preventDefault(); redo(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (k === "escape") { st.pending = null; st.sel = null; if (st.tool !== "select") setTool("select"); renderInspector(); highlightRows(); drawCanvas(); }
  else if (k === "delete" || k === "backspace") { if (st.sel && (st.step === 3 || (st.step === 2 && st.sel.t === "v"))) { ev.preventDefault(); deleteSel(); } }
  else if (k === "f") fit();
  else if (st.step === 3 && k === "v") setTool("select");
  else if (st.step === 3 && k === "n" && st.spec.dim === 2) setTool("node");
  else if (st.step === 3 && k === "m") setTool("member");
  else if (st.step === 3 && k === "d") setTool("delete");
  else if (/^[1-6]$/.test(k)) goStep(+k);
});
let rT = null; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(fit, 120); });
let tT = null; function toast(msg){ let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(tT); tT = setTimeout(() => t.remove(), 2600); }

// ===================================================================== start: example transfer girder
st.params.deep_beam = {rho_h: 0.003, rho_v: 0.003, As_tie: 2400, db: 25};
generate(); analyze(); syncOpts(); renderAll();
requestAnimationFrame(() => { fit(); lastBox = JSON.stringify(st.spec.nodes.map(n => n.xyz).concat(st.spec.outline || [])); });
window.__stm = st;
})();
</script>

</body></html>
